analysis:
  name: baseline_cuts
  # The pipeline supplies the run tag and campaign paths.
  detector_response: ssc
  luminosity_fb: 100.0
  # The loop continuum and dijet double fakes use the published 40 TeV response weights.
  ssc40_student_backgrounds: true
  samples: signal_gg_h_aa,bkg_prompt_aa,bkg_gamma_j,bkg_dy_ee,bkg_loop_gg_aa,bkg_dijet_double_fake
  # HO rates come from the validated normalization sidecars. The saved signal
  # weights already contain BR(H -> gamma gamma) once; no LO K-factor applies.
  cuts:
    - variable: n_selected_photons
      min: 2
    - variable: m_gg
      min: 120.0
      max: 130.0
